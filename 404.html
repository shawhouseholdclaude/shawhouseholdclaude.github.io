<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crokinole scorecards</title>
<style>
  :root { --ink:#1b1d21; --muted:#5d636d; --line:#d9dce1; --bg:#f4f5f7; --card:#fff; --accent:#1f5fbf; --accent-ink:#fff;
          --ok:#1d7a3a; --ok-bg:#e5f4ea; --warn:#9a5b00; --warn-bg:#fff2d6; --bad:#b3261e; --bad-bg:#fde8e6; --sel:#1b1d21; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px 16px 96px; }
  h1 { font-size:22px; margin:4px 0 2px; } h2 { font-size:18px; margin:20px 0 8px; }
  .sub { color:var(--muted); margin:0 0 12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:52px; padding:12px 16px; border-radius:10px;
         border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn + .btn { margin-top:10px; }
  .note { padding:10px 12px; border-radius:10px; margin:10px 0; }
  .note.ok { background:var(--ok-bg); color:var(--ok); } .note.warn { background:var(--warn-bg); color:var(--warn); } .note.bad { background:var(--bad-bg); color:var(--bad); }
  .guide { display:flex; gap:14px; align-items:center; }
  .frame { flex:none; width:74px; height:104px; border:2px solid var(--line); border-radius:6px; position:relative; background:#fff; }
  .frame i { position:absolute; width:10px; height:10px; background:var(--ink); } .frame i:nth-child(1){top:5px;left:5px;width:13px;height:13px}
  .frame i:nth-child(2){top:5px;right:5px} .frame i:nth-child(3){bottom:5px;left:5px} .frame i:nth-child(4){bottom:5px;right:5px}
  .guide ul { margin:0; padding-left:18px; color:var(--muted); }
  input[type=file] { display:none; }
  .spin { width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  .game { border-top:1px solid var(--line); padding:10px 0; } .game:first-child { border-top:0; }
  .ghead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; }
  .ghead b { font-size:16px; } .ghead span { color:var(--muted); font-size:14px; } .ghead .pts { color:var(--ink); font-weight:700; white-space:nowrap; }
  .strip { width:100%; display:block; border-radius:6px; margin-bottom:6px; background:#eee; }
  .rounds { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .rnd { border:1px solid var(--line); border-radius:8px; padding:4px; }
  .rnd.check { border:2px solid var(--warn); background:var(--warn-bg); }
  .rnd .lbl { font-size:11px; color:var(--muted); text-align:center; }
  .opts { display:grid; grid-template-columns:repeat(4, 1fr); gap:2px; }
  .opts button { min-height:34px; border:1px solid var(--line); background:#fff; border-radius:6px; font:inherit; font-weight:700; padding:0; color:var(--ink); }
  .opts button.on { background:var(--sel); color:#fff; border-color:var(--sel); }
  .opts button.blank { font-weight:400; color:var(--muted); } .opts button.blank.on { color:#fff; }
  label.field { display:block; font-weight:600; margin:6px 0; } label.field input { display:block; width:100%; margin-top:6px; font:inherit; font-size:20px; padding:10px; border:1px solid var(--line); border-radius:8px; }
  .sticky { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .sticky .in { max-width:720px; margin:0 auto; display:flex; gap:10px; align-items:center; } .sticky .btn { flex:1; } .sticky .tot { white-space:nowrap; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:15px; } th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:right; }
  th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align:left; } th { font-size:13px; color:var(--muted); font-weight:600; }
  td .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:99px; margin-left:4px; }
  .tag.p { background:var(--warn-bg); color:var(--warn); } .tag.d { background:var(--bad-bg); color:var(--bad); }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; } .stats div { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; }
  .stats b { display:block; font-size:20px; } .stats span { font-size:12px; color:var(--muted); }
  .issues li { margin:4px 0; } .muted { color:var(--muted); } .row { display:flex; gap:10px; } .row > * { flex:1; }
  .mgrid { overflow-x:auto; } .mgrid table { font-size:13px; } .st-confirmed { color:var(--ok); } .st-provisional { color:var(--warn); } .st-disputed { color:var(--bad); font-weight:700; } .st-pending { color:var(--muted); }
  @media (max-width:420px) { .opts button { min-height:38px; } .stats b { font-size:18px; } }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script src="/config.js"></script>
<script src="/standings.js"></script>
<script src="/app.js"></script>
</body>
</html>
